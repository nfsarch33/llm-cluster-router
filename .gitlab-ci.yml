stages:
  - lint
  - test
  - build
  - security
  - deploy
  - sync
  - notify

variables:
  GOVERSION: "1.26"
  GOFLAGS: "-buildvcs=false"

.go_base:
  image: golang:${GOVERSION}
  before_script:
    - go mod download
  tags:
    - docker

vet:
  extends: .go_base
  stage: lint
  script:
    - go vet ./...

lint:
  extends: .go_base
  stage: lint
  script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --timeout 5m ./...
  allow_failure: true

test:
  extends: .go_base
  stage: test
  script:
    - go test -race -count=1 -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
    expire_in: 7 days
  coverage: "/total:\\s+\\(statements\\)\\s+(\\d+\\.\\d+)%/"

# Ginkgo integration-test gate per L0 rule 42 (integration-test-gating).
# This is the Helixon central-server core-service gate: every PR that
# touches a handler, gRPC method, CLI command, or persisted schema in
# a gated service MUST ship a failing Ginkgo integration spec in the
# same PR; the full integration suite is a hard merge gate.
integration:ginkgo:
  extends: .go_base
  stage: test
  tags:
    - helixon-runner
    - wsl
  script:
    - go install github.com/onsi/ginkgo/v2/ginkgo@latest
    - ginkgo -r --tags=integration --trace --cover --coverprofile=integration.coverprofile
    - go tool cover -func=integration.coverprofile | tee coverage.txt
    - go test -race -tags=integration -count=1 ./...
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: integration.coverprofile
    paths:
      - integration.coverprofile
      - coverage.txt
    expire_in: 7 days
  coverage: "/total:\\s+\\(statements\\)\\s+(\\d+\\.\\d+)%/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: []

build:
  extends: .go_base
  stage: build
  script:
    - CGO_ENABLED=0 go build -ldflags "-s -w" -o llm-cluster-router .
  artifacts:
    paths:
      - llm-cluster-router
    expire_in: 7 days
  only:
    - main
    - tags

deploy-fleet-host:
  stage: deploy
  tags:
    - fleet
    - gpu-host-1
  needs:
    - build
  script:
    - install -m 755 llm-cluster-router /home/jason/bin/llm-cluster-router
    - systemctl --user restart llm-cluster-router.service || true
    - timeout 10 curl -sf --max-time 5 http://127.0.0.1:8787/v1/models | head -c 200
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

govulncheck:
  extends: .go_base
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...

gosec:
  extends: .go_base
  stage: security
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -quiet ./...
  allow_failure: true

github-sync:
  stage: sync
  tags:
    - docker
  image: golang:${GOVERSION}
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - |
      if [ -z "${GITHUB_SYNC_TOKEN}" ] || [ -z "${GITHUB_REPO_URL}" ]; then
        echo "WARN: sync vars not set, skipping"; exit 0
      fi
    - |
      PUSH_URL="${GITHUB_REPO_URL}"
      if echo "${PUSH_URL}" | grep -q "^https://"; then
        PUSH_URL=$(echo "${PUSH_URL}" | sed "s|https://|https://x-access-token:${GITHUB_SYNC_TOKEN}@|")
      fi
    - git remote add github "${PUSH_URL}" 2>/dev/null || git remote set-url github "${PUSH_URL}"
    - git fetch origin --unshallow 2>/dev/null || true
    - git push github "HEAD:${CI_COMMIT_REF_NAME}" --force
    - echo "Synced ${CI_COMMIT_REF_NAME} to GitHub"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  after_script:
    - git remote remove github 2>/dev/null || true
  allow_failure: true

ci-failure-notify:
  stage: notify
  tags:
    - docker
  image: golang:${GOVERSION}
  when: on_failure
  allow_failure: true
  script:
    - |
      if [ -z "${NOTIFICATION_WEBHOOK_URL}" ]; then
        echo "WARN: NOTIFICATION_WEBHOOK_URL not set, skipping"; exit 0
      fi
    - |
      curl -sf -X POST "${NOTIFICATION_WEBHOOK_URL}" -H "Content-Type: application/json" \
        -d '{"title":"CI failure: '${CI_PROJECT_NAME}' #'${CI_PIPELINE_ID}' on '${CI_COMMIT_REF_NAME}'","status":"open","source":"gitlab-ci"}' \
        || echo "WARN: notification failed"
  rules:
    - when: on_failure
