# llm-cluster-router sample configuration
#
# SECURITY: Do NOT point this router at corporate or managed AI gateways
# (e.g. ai-gateway.zende.sk). This tool is for self-hosted GPU clusters only.

listen: ":8080"
metrics_addr: ":9091"
debug_addr: ":6060"
log_level: info

# Optional bearer auth for /v1/* endpoints. Leave empty to disable.
# auth_token: ${ROUTER_AUTH_TOKEN}

defaults:
  max_queue_depth: 8
  max_concurrency: 2
  request_timeout: 120s
  max_body_size: 1048576

health_check:
  interval: 15s
  timeout: 5s
  path: /health
  unhealthy_threshold: 3
  healthy_threshold: 1

nodes:
  - name: gpu-0-agent
    url: http://127.0.0.1:8001
    tier: agent
    priority: 0
    weight: 4
    models: ["qwen3.5-27b"]
  - name: gpu-1-fast
    url: http://127.0.0.1:8002
    tier: fast
    priority: 0
    weight: 2
    models: ["qwen3.5-9b"]
  # Cloud fallback example (env var expansion supported for api_key):
  # - name: deepseek-v3-reasoning
  #   url: https://api.deepseek.com
  #   tier: reasoning
  #   priority: 10
  #   weight: 1
