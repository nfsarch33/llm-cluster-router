# llm-cluster-router sample configuration
#
# SECURITY: This router refuses to start when any node URL hostname
# matches a corporate or managed AI gateway suffix. The forbidden list
# is enforced by validateUpstreamURL() in main.go and currently blocks
# *.zende.sk and *.zendesk.com (case-insensitive, apex + subdomain).
# This tool is for self-hosted GPU clusters only — point it at a
# corporate gateway and the prompts (with any embedded secrets, PII,
# or proprietary data) will silently cross a trust boundary you did
# not opt into. To extend the list, edit forbiddenUpstreamHostSuffixes
# in main.go and add a regression test.

listen: ":8080"
metrics_addr: ":9091"
debug_addr: ":6060"
log_level: info

# Optional bearer auth for /v1/* endpoints. Leave empty to disable.
# auth_token: ${ROUTER_AUTH_TOKEN}

defaults:
  max_queue_depth: 8
  max_concurrency: 2
  request_timeout: 120s
  max_body_size: 1048576
  # How long the router waits for the NEXT bytes of a request body before it
  # gives up on the read. It is an INACTIVITY bound, refreshed by every read
  # that makes progress, so a caller on a slow link is never cut off for being
  # slow -- only one that has gone silent is.
  #
  # It matters because a queue slot is taken BEFORE the body is read and held
  # across the read: without this, max_queue_depth callers who simply stop
  # sending are enough to make the router answer 429 to everybody else. A
  # stalled caller is answered 408 and its slot goes straight back.
  #
  # Omit the key or write 0s for the 15s default. A negative value is a startup
  # error; there is no spelling for "wait forever".
  body_read_timeout: 15s
  # Per-upstream circuit breaker tuning. Opens after `threshold` consecutive
  # failures and stays open for `cooldown` before a half-open probe. Defaults
  # to 5 / 30s when omitted. Raise the threshold / shorten the cooldown for a
  # single-tier provider (e.g. MiniMax) that flaps briefly under 429 bursts so
  # one rate-limit window does not eject the only upstream. Per-node `circuit`
  # blocks override these globally-applied defaults.
  circuit:
    threshold: 5
    cooldown: 30s

health_check:
  interval: 15s
  timeout: 5s
  path: /health
  unhealthy_threshold: 3
  healthy_threshold: 1

# Per-user fair-share rate limiting. When enabled, each user (identified
# by the X-User header, or a hash of the bearer token) gets an independent
# sliding-window token bucket. This prevents any single user from
# monopolising the shared GPU cluster.
# Disabled by default; the global queue depth + concurrency semaphore
# still provide backpressure.
fair_share:
  enabled: false
  max_requests_per_user: 10
  window: 60s
  burst: 3

nodes:
  - name: gpu-0-agent
    url: http://127.0.0.1:8001
    tier: agent
    priority: 0
    weight: 4
    models: ["qwen3.5-27b"]
  - name: gpu-1-fast
    url: http://127.0.0.1:8002
    tier: fast
    priority: 0
    weight: 2
    models: ["qwen3.5-9b"]
  # Cloud fallback example (env var expansion supported for api_key):
  # - name: deepseek-v3-reasoning
  #   url: https://api.deepseek.com
  #   tier: reasoning
  #   priority: 10
  #   weight: 1
  #   api_key: ${DEEPSEEK_API_KEY}
  #   models: ["deepseek-chat"]
  #
  # Single-node multi-key round-robin (quota spreading within ONE upstream).
  # NOTE: this shares ONE circuit breaker across both keys, so a breaker trip
  # ejects BOTH keys together. Prefer the two-tier layout below when you need
  # INDEPENDENT per-key breakers/quota.
  # - name: minimax-overflow
  #   url: https://api.minimax.chat
  #   tier: fast
  #   priority: 5
  #   weight: 1
  #   api_keys:
  #     - ${MINIMAX_API_KEY_1}
  #     - ${MINIMAX_API_KEY_2}
  #   models: ["minimax-text"]
  #
  # ---------------------------------------------------------------------------
  # M3 capacity fallback chain (Tier B -> Tier C). This is the resilient layout
  # that fixes the eval-RED root cause: 8 heavy Level-3 code-gen tasks
  # deterministically 502 against a SINGLE saturated M3 tier, and a breaker
  # that never re-probed (health_check_disabled:true) so the only upstream
  # never recovered. The chain below spreads M3 load across TWO independent
  # keys, then strictly falls back to a local-GPU (or M2.7) tier, and lets the
  # breaker self-heal.
  #
  # How the router expresses the ordered chain (no special-casing required):
  #   * Same model id on every node ("minimax-m3") so any of them can serve a
  #     given request. SupportsModel is an EXACT match — a fallback that should
  #     absorb M3 traffic MUST advertise "minimax-m3".
  #   * Equal lowest `priority` (0) on the two M3 keys => weighted round-robin
  #     spreads load fairly across both keys (Tier B). Two distinct nodes =>
  #     two INDEPENDENT circuit breakers and independent quota.
  #   * Higher `priority` (10) on the fallback => it is only consulted once both
  #     M3 keys are unhealthy / breaker-open / already tried for this request
  #     (Tier C, strict fallback).
  #   * On a 429 or 5xx RESPONSE (not just a transport error) the router records
  #     a breaker failure AND fails over to the next untried node in the chain,
  #     before any bytes are streamed to the client.
  #   * health_check_disabled:false (the default) keeps each node in the probe
  #     loop so a node marked unhealthy on a transient blip self-heals once the
  #     upstream answers a health check again.
  #
  # Run two bridge instances (one per key) for TRULY independent quota:
  # - name: minimax-m3-key1
  #   url: http://127.0.0.1:8500        # minimax-openai-bridge pinned to key 1
  #   tier: reasoning
  #   priority: 0
  #   weight: 1
  #   api_key: ${MINIMAX_API_KEY_1}
  #   models: ["minimax-m3", "MiniMax-M3"]
  #   health_check_disabled: false       # self-heal: re-probe & recover after a trip
  #   circuit:
  #     threshold: 8                      # tolerate short 429/502 bursts...
  #     cooldown: 15s                     # ...but re-probe quickly
  # - name: minimax-m3-key2
  #   url: http://127.0.0.1:8501        # second bridge instance pinned to key 2
  #   tier: reasoning
  #   priority: 0                         # same priority as key1 => fair spread
  #   weight: 1
  #   api_key: ${MINIMAX_API_KEY_2}
  #   models: ["minimax-m3", "MiniMax-M3"]
  #   health_check_disabled: false
  #   circuit:
  #     threshold: 8
  #     cooldown: 15s
  # - name: local-gpu-codegen-fallback
  #   url: http://127.0.0.1:8001        # 3090/4070 llama.cpp lane (or MiniMax-M2.7)
  #   tier: reasoning
  #   priority: 10                        # strict fallback: only when both M3 keys are down
  #   weight: 1
  #   models: ["minimax-m3", "MiniMax-M3", "qwen3.5-27b"]
  #   health_check_disabled: false

# Task-aware routing + per-agent gates (see configs/smartroute.example.yml).
# model:"auto" resolves via policy classes; X-Helixon-Agent identifies the
# caller; an agent flagged false gets 403; force_class pins ALL of one
# agent's traffic to a class regardless of the model id it sends.
smart_route:
  enabled: false
  policy_file: configs/smartroute.example.yml
