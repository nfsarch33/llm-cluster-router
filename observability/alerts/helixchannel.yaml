# Prometheus alerting rules for HelixChannel (v18729-2).
#
# Source metrics:
#   - llm_cluster_router_connections_total{listener,outcome}
#   - llm_cluster_router_decrypt_failed_total{listener}
#   - llm_cluster_router_request_duration_seconds_bucket{listener,model}
#   - llm_cluster_router_request_duration_seconds_bucket{listener,method}
#   - llm_cluster_router_helixchannel_session_total{outcome}
#
# Severity ladder:
#   - page   → operator paged within 5min via Resend/Slack notification
#   - warn   → logged + dashboard annotation, no page
#
# These rules complement observability/alerts/helixchannel-sessions.yaml
# (v18714-3 session-level alerts). The v18729-2 alerts add:
#   - TTFB p95 latency (SLO-18729-2.A)
#   - 5xx-rate via failure outcome (SLO-18729-2.B)
#   - decrypt-failed-rate by listener (SLO-18729-2.C)
#   - connections error-rate spike (SLO-18729-2.D)
#
# Notification routing is wired in observability/alertmanager/helixchannel.yaml
# (Slack webhook + Resend operator email).

groups:
  - name: helixchannel.v18729-2
    interval: 30s
    rules:

      # SLO-18729-2.A — TTFB p95 above 1s for > 5min.
      # Pages because slow TTFB breaks the user-facing chat UX and
      # usually indicates upstream provider degradation (minimaxi.com,
      # Aliyun Beijing) or TLS handshake stalls.
      - alert: HelixChannelTTFBHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, listener, model) (
              rate(llm_cluster_router_request_duration_by_model_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: page
          slo: "SLO-18729-2.A"
          channel: helixchannel
        annotations:
          summary: "HelixChannel TTFB p95 > 1s on {{ $labels.instance }}"
          description: |
            TTFB p95 is {{ $value | printf "%.3f" }}s over the last 5 minutes.
            User-visible latency breach. Investigate upstream provider health
            (minimaxi.com / Aliyun Beijing) and recent TLS handshake timing.

      # SLO-18729-2.B — 5xx-rate via failure outcome > 1/s sustained 5min.
      # Pages because sustained 5xx breaks production wire.
      - alert: HelixChannel5xxRateHigh
        expr: |
          sum(
            rate(llm_cluster_router_helixchannel_session_total{outcome="failure"}[5m])
          ) > 1
        for: 5m
        labels:
          severity: page
          slo: "SLO-18729-2.B"
          channel: helixchannel
        annotations:
          summary: "HelixChannel 5xx-rate > 1/s on {{ $labels.instance }}"
          description: |
            Failure rate is {{ $value | printf "%.3f" }}/s over the last 5 minutes.
            Investigate upstream 5xx responses (minimaxi.com / Aliyun / vLLM /
            SOCKS5 path). Cross-check llm_cluster_router_connections_total{outcome="error"}.

      # SLO-18729-2.C — decrypt-failed-rate by listener.
      # Pages on any non-zero sustained 1min; any decrypt failure
      # indicates wire tampering or key/IV mismatch.
      - alert: HelixChannelDecryptFailedRateHigh
        expr: |
          sum by (listener) (
            rate(llm_cluster_router_decrypt_failed_total[1m])
          ) > 0
        for: 1m
        labels:
          severity: page
          slo: "SLO-18729-2.C"
          channel: helixchannel
        annotations:
          summary: "HelixChannel decrypt-failed-rate > 0/s on {{ $labels.listener }}"
          description: |
            Decrypt failure rate is {{ $value | printf "%.3f" }}/s over the last 1 minute
            on listener={{ $labels.listener }}. Wire tampering or key drift suspected;
            rotate HELIXCHANNEL_KEY and review observability/runbook.md#helixchannel-decrypt-failed.

      # SLO-18729-2.D — connections error-rate spike.
      # Warns on any error outcome rate > 0.5/s sustained 5min;
      # investigates upstream (TLS handshake, listener reject).
      - alert: HelixChannelConnectionErrors
        expr: |
          sum(
            rate(llm_cluster_router_connections_total{outcome="error"}[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warn
          slo: "SLO-18729-2.D"
          channel: helixchannel
        annotations:
          summary: "HelixChannel connection error-rate elevated on {{ $labels.instance }}"
          description: |
            Connection error rate is {{ $value | printf "%.3f" }}/s over the last
            5 minutes. Investigate TLS handshake failures and listener rejects.