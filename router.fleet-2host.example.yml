# llm-cluster-router fleet config — multi-host reference example.
#
# Replace `<your-host-1>` and `<your-host-2>` with your fleet's hostnames
# or IPs. Replace `<tier>`, `<model-name>`, and bearer auth as needed.
#
# Health probes every 15s; threshold 3; cooldown 30s.

listen: ":8080"
metrics_addr: ":9091"
debug_addr: ":6060"
log_level: info

defaults:
  max_queue_depth: 8
  max_concurrency: 2
  request_timeout: 180s
  max_body_size: 4194304
  circuit:
    threshold: 5
    cooldown: 30s

health_check:
  interval: 15s
  timeout: 5s
  path: /health
  unhealthy_threshold: 3
  healthy_threshold: 1

# Per-tenant fair-share rate limiting. When enabled, each tenant
# (identified by the X-Tenant header, or a hash of the bearer token)
# gets an independent sliding-window token bucket.
fair_share:
  enabled: false

nodes:
  # ----- Local fast lane: GPU host 1 (small/fast model) -----
  - name: gpu-host-1-fast
    url: http://<your-host-1>:11434
    tier: fast
    priority: 0
    weight: 2
    models:
      - <fast-model-name>
    circuit:
      threshold: 3
      cooldown: 20s

  # ----- Local reasoning lane: GPU host 1 (large/reasoning model) -----
  - name: gpu-host-1-reasoning
    url: http://<your-host-1>:11435
    tier: reasoning
    priority: 0
    weight: 4
    models:
      - <reasoning-model-name>
    circuit:
      threshold: 5
      cooldown: 30s

  # ----- Secondary: GPU host 2 (reasoning lane failover) -----
  # Marked priority 5 so GPU host 1 lane is preferred (lower latency), but
  # host 2 picks up overflow automatically when host 1 is saturated
  # (queue depth >= max_queue_depth).
  - name: gpu-host-2-reasoning
    url: http://<your-host-2>:11435
    tier: reasoning
    priority: 5
    weight: 4
    models:
      - <reasoning-model-name>
    circuit:
      threshold: 5
      cooldown: 60s       # tolerate 30-60s WAN latency blips
    health_check:
      interval: 30s       # probe less frequently (WAN/relay)
      timeout: 10s
      unhealthy_threshold: 3
      healthy_threshold: 1

  # ----- Embedding lane (for memory / RAG / agent harnesses) -----
  - name: gpu-host-1-embedder
    url: http://<your-host-1>:8281
    tier: embed
    priority: 0
    weight: 2
    models:
      - <embedding-model-name>
    circuit:
      threshold: 3
      cooldown: 20s

# Default model selection: agents query the reasoning model for code,
# fast model for chat. This explicit mapping prevents accidental fall-through.
