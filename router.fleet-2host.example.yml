# llm-cluster-router fleet config — v14888
# Primary GPU host + secondary GPU host peer pool, no cloud fallbacks.
#
# Live endpoints verified via Tailscale DERP (primary <-> secondary RTT ~250ms).
# Health probes every 15s; threshold 3; cooldown 30s.

listen: ":8080"
# metrics_addr / debug_addr bind LOOPBACK when the host is omitted:
# ":9091" resolves to 127.0.0.1:9091. Neither listener sits behind the
# bearer middleware that guards /v1/*, and pprof serves heap dumps and a
# blocking CPU profile, so the default must not be every interface.
# Spell an explicit host (0.0.0.0, ::, a specific address) to opt out.
metrics_addr: "127.0.0.1:9091"
# pprof is OFF unless debug_addr is set. Set it deliberately.
debug_addr: "127.0.0.1:6060"
log_level: info

defaults:
  max_queue_depth: 8
  max_concurrency: 2
  request_timeout: 180s
  max_body_size: 4194304
  circuit:
    threshold: 5
    cooldown: 30s

health_check:
  interval: 15s
  timeout: 5s
  path: /health
  unhealthy_threshold: 3
  healthy_threshold: 1

# No fair-share: cluster is private, single user (jaslian).
fair_share:
  enabled: false

# Per-user fair-share rate limiting. When enabled, each user (identified
# by the X-User header, or a hash of the bearer token) gets an independent
# sliding-window token bucket.
# Disabled: solo fleet, no contention yet.
nodes:
  # ----- Local fast lane: primary-host Ollama (qwen3.5-9b) -----
  - name: primary-ollama-fast
    url: http://127.0.0.1:11434
    tier: fast
    priority: 0
    weight: 2
    models:
      - qwen3.5-9b
      - qwen3.5-9b-instruct
    circuit:
      threshold: 3
      cooldown: 20s

  # ----- Local reasoning lane: primary-host Qwen 3.6 27B (RTX 3090 #0) -----
  - name: primary-llama-coder-27b
    url: http://127.0.0.1:11435
    tier: reasoning
    priority: 0
    weight: 4
    models:
      - qwen3.6-27b
      - Qwen3.6-27B-Q4_K_M
    circuit:
      threshold: 5
      cooldown: 30s

  # ----- Secondary: secondary-host llama.cpp CUDA server (Qwen 3.6 27B) -----
  # Reachable via Tailscale DERP from primary; 250-400ms RTT through relay.
  # Marked priority 5 so primary lane is preferred (no relay), but
  # secondary picks up overflow automatically when primary is saturated
  # (queue depth >= max_queue_depth).
  - name: secondary-llama-coder-27b
    url: http://<tailscale-host>:11435
    tier: reasoning
    priority: 5
    weight: 4
    models:
      - qwen3.6-27b
      - Qwen3.6-27B-Q4_K_M
    circuit:
      threshold: 5
      cooldown: 60s       # tolerate 30-60s relay latency blips
    health_check:
      interval: 30s       # probe less frequently (DERP relay)
      timeout: 10s
      unhealthy_threshold: 3
      healthy_threshold: 1

  # ----- Embedding lane (for sprintboard / engram / helixon-evolver) -----
  - name: primary-engram-embedder
    url: http://127.0.0.1:8281
    tier: embed
    priority: 0
    weight: 2
    models:
      - nomic-embed-text:v1.5
      - text-embedding-nomic-embed-text-v1.5
    circuit:
      threshold: 3
      cooldown: 20s

# Default model selection: agents query "qwen3.6-27b" for code, fast/9b for chat.
# This explicit mapping prevents accidental Ollama fall-through.