name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers commit-historical secrets
          # too, not just the working tree.
          fetch-depth: 0

      - name: install gitleaks
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION}"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"

          curl --location --fail --silent --show-error \
              --output "${tarball}" "${url}"

          tar -xzf "${tarball}" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: scan working tree
        run: |
          set -euo pipefail
          ./gitleaks dir . \
              --config .gitleaks.toml \
              --report-path gitleaks-report.json \
              --report-format json \
              --exit-code 1

      - name: scan git history
        # Separate step so a working-tree finding and a history finding
        # surface as distinct check failures.
        run: |
          set -euo pipefail
          ./gitleaks git . \
              --config .gitleaks.toml \
              --report-path gitleaks-history-report.json \
              --report-format json \
              --exit-code 1

      - name: upload gitleaks reports
        # Always upload, even on failure, so triagers can inspect the
        # exact rule + line that fired.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: |
            gitleaks-report.json
            gitleaks-history-report.json
          if-no-files-found: ignore
