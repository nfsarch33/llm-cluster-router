name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers commit-historical secrets
          # too, not just the working tree.
          fetch-depth: 0

      - name: gitleaks
        # v2.3.9 pinned by SHA. Bump in a dedicated PR so the bump
        # diff is auditable on its own.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Allowlist + rule overrides live in .gitleaks.toml at the
          # repo root. Inline `# gitleaks:allow` comments are also
          # honoured for one-off test fixtures.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
