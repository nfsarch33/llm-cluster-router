name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pkg-config (needed by prometheus client)
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Vet
        run: go vet ./...

      - name: Test (unit)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration tests (httptest mock upstreams)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Test (integration, build tag)
        # Tagged tests live in *_test.go files with `//go:build integration`.
        # They start the router in-process and hit it through real HTTP.
        run: go test -tags=integration -timeout=2m -count=1 -race -v -run TestIT_ ./...

  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0

  security:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      - name: gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./...
        continue-on-error: true

      - name: nancy (dependency audit)
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -deps ./... | nancy sleuth
        continue-on-error: true

      - name: trivy fs (vuln + secret + misconfig)
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" v0.58.1
          fi
          trivy fs --scanners vuln,secret,misconfig --exit-code 0 --severity HIGH,CRITICAL --no-progress .
        continue-on-error: true
