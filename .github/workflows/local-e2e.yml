# Local topology E2E: runs ON the serving host (self-hosted runner), so it can
# reach the router (:8787) and the local model (:8010) over loopback. This is
# the automated QA gate for the local serving stack — it fires on every merge
# to main touching serving/routing code, on a schedule, and on demand.
#
# SKIP-safe: if the local stack is not present on the runner (e.g. a future
# cloud runner), each probe step no-ops with a notice instead of failing, so
# the workflow never reds a machine that simply doesn't serve models.
name: local-e2e

on:
  push:
    branches: [main]
    paths:
      - "main.go"
      - "internal/smartroute/**"
      - "internal/config/**"
      - "configs/smartroute.example.yml"
      - ".github/workflows/local-e2e.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  topology:
    name: local-topology-e2e
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Router health
        run: |
          if ! curl -sf --max-time 5 http://127.0.0.1:8787/healthz; then
            echo "::notice::router not present on this runner — skipping local topology E2E"
            echo "SKIP_STACK=1" >> "$GITHUB_ENV"
          fi

      - name: Local model health
        if: env.SKIP_STACK != '1'
        run: curl -sf --max-time 5 http://127.0.0.1:8010/health

      # The router authenticates /v1/*. This step is the NEGATIVE control and
      # needs no credential: it asserts the gate is actually enforcing, so a
      # router that silently stopped requiring auth reds the build instead of
      # passing the authenticated probes below for the wrong reason.
      - name: Auth gate regression (unauthenticated must be refused)
        if: env.SKIP_STACK != '1'
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            http://127.0.0.1:8787/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3.8-27b-local","messages":[{"role":"user","content":"hi"}],"max_tokens":8}')
          if [ "$CODE" != "401" ]; then
            echo "::error::unauthenticated /v1/chat/completions returned $CODE, want 401 — the router auth gate is not enforcing"
            exit 1
          fi
          echo "unauthenticated request correctly refused (401)"

      # Fail rather than skip when the stack is serving but no token is
      # configured: skipping here would turn the only real end-to-end
      # assertion into a step that cannot fail, which is how this workflow
      # went red-then-unnoticed in the first place.
      - name: Require router token when the stack is serving
        if: env.SKIP_STACK != '1'
        env:
          LLM_ROUTER_TOKEN: ${{ secrets.LLM_ROUTER_TOKEN }}
        run: |
          if [ -z "${LLM_ROUTER_TOKEN:-}" ]; then
            echo "::error::the router is serving on :8787 and requires auth, but secret LLM_ROUTER_TOKEN is not set for this repository; the authenticated probes below cannot run and must not be skipped"
            exit 1
          fi
          echo "router token present"

      - name: "Chat round-trip through router (regression of the full serving path)"
        if: env.SKIP_STACK != '1'
        env:
          LLM_ROUTER_TOKEN: ${{ secrets.LLM_ROUTER_TOKEN }}
        run: |
          RESP=$(curl -sf --max-time 240 http://127.0.0.1:8787/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_ROUTER_TOKEN" \
            -d '{"model":"qwen3.8-27b-local","messages":[{"role":"user","content":"Reply with exactly: E2E-OK"}],"max_tokens":200,"temperature":0}')
          echo "$RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d['choices'][0]['message']['content'], 'empty completion'
          assert d['usage']['completion_tokens'] > 0, 'no tokens generated'
          print('round-trip OK:', d['usage'])"

      - name: Agent gate regression (disabled agent must 403)
        if: env.SKIP_STACK != '1'
        env:
          LLM_ROUTER_TOKEN: ${{ secrets.LLM_ROUTER_TOKEN }}
        run: |
          # Only meaningful when the deployed policy gates an agent; probe and
          # assert consistency rather than assuming the flag's value. The
          # request is authenticated so a 401 cannot masquerade as a gate
          # decision — 401 is an auth failure, 403 is the gate refusing.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 \
            http://127.0.0.1:8787/v1/chat/completions \
            -H "Content-Type: application/json" -H "X-Helixon-Agent: codex" \
            -H "Authorization: Bearer $LLM_ROUTER_TOKEN" \
            -d '{"model":"qwen3.8-27b-local","messages":[{"role":"user","content":"hi"}],"max_tokens":8}')
          echo "codex probe -> HTTP $CODE"
          case "$CODE" in
            200|403) echo "agent gate responds deterministically" ;;
            401) echo "::error::agent-gate probe got 401 — the token is wrong, not a gate decision"; exit 1 ;;
            *) echo "unexpected status $CODE from agent gate"; exit 1 ;;
          esac

      - name: Smartroute policy validation (shipped example must always load)
        run: go run scripts/validate-smartroute.go configs/smartroute.example.yml
